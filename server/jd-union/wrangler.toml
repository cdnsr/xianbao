name = "jd-union"
main = "index.js"
compatibility_date = "2026-09-01"

# 凭据一律用 `wrangler secret put` 设置，不要写在这里。
# 本文件提交到仓库是安全的，因为它不含任何密钥。
#
# 刻意不配置 [observability]：开启后 Cloudflare 控制台的 Worker「日志 / Logs」
# 页会去查 Logpush，而 Logpush 是 Enterprise 功能，免费账号会直接弹
# 「无访问权限：logpush is not enabled for this account」。
# 本服务不需要日志就能跑；要在控制台看日志，等账号支持了再加回来。
