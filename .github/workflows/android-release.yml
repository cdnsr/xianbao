# Android Release (tag driven)
#
# 发版方式：在 main 上打 vX.Y.Z tag 并推送，例如
#   git tag v1.5.0 && git push origin v1.5.0
#
# 1) 从 tag 解析 versionName（v1.5.0 -> 1.5.0）
# 2) flutter build apk --release --split-per-abi
# 3) 在该 tag 上发布公开 GitHub Release
# 4) 回写 pubspec.yaml 与 publish/version.json 到 main（供客户端检测更新）
#
# 推送到 main 不再自动发版，只发代码。tag 必须打在 main 的提交上，
# 否则第 4 步会跳过（Release 仍会正常发布）。
#
# 手动 workflow_dispatch 同样需要选择 vX.Y.Z 形式的 tag 作为 ref。
#
# User-facing version is versionName only: 1.4.9 / 1.5.0 (no +build).
# Client update check reads publish/version.json (multi-CDN mirrors).
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Decode Android keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure repository Secrets before releasing. See docs/CI_RELEASE.md" >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties
          ls -la android/app/upload-keystore.jks
          echo "key.properties written (secrets redacted)"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version from tag
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Tag name is the single source of truth: v1.5.0 -> 1.5.0
          version="${REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::触发 ref '${REF_NAME}' 不是 vX.Y.Z 形式的 tag。请推送 tag，或手动运行时在 ref 下拉框中选择 tag。" >&2
            exit 1
          fi

          # Keep Android versionCode monotonically increasing.
          line="$(grep -E '^version:' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          current="${line#version:}"
          current_code="${current##*+}"
          if [[ ! "$current_code" =~ ^[0-9]+$ ]]; then
            current_code=0
          fi
          version_code=$((current_code + 1))
          if (( RUN_NUMBER > version_code )); then
            version_code=$RUN_NUMBER
          fi

          # Never publish a version older than what clients already see.
          published="$(python3 -c 'import json,pathlib;p=pathlib.Path("publish/version.json");print(str(json.loads(p.read_text("utf-8")).get("version") or "") if p.exists() else "")')"
          if [[ -n "$published" ]]; then
            if ! NEW="$version" PREV="$published" python3 -c 'import os,sys;f=lambda v:tuple(int(x) for x in v.split("."));sys.exit(0 if f(os.environ["NEW"])>=f(os.environ["PREV"]) else 1)'; then
              echo "::error::tag 版本 ${version} 低于已发布的 ${published}，拒绝降级发版。" >&2
              exit 1
            fi
          fi

          echo "Releasing ${version} (+${version_code}) from tag ${REF_NAME} (previous: ${published:-none})"
          {
            echo "version_name=${version}"
            echo "version_code=${version_code}"
            echo "version_full=${version}+${version_code}"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Package versioned APKs
        shell: bash
        run: |
          set -euo pipefail
          out="build/app/outputs/flutter-apk"
          ver="${{ steps.version.outputs.version_name }}"
          mkdir -p dist
          cp "$out/app-armeabi-v7a-release.apk" "dist/xianbao-v${ver}-armv7-release.apk"
          cp "$out/app-arm64-v8a-release.apk" "dist/xianbao-v${ver}-armv8-release.apk"
          cp "$out/app-x86_64-release.apk" "dist/xianbao-v${ver}-x86_64-release.apk"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: xianbao ${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 线报酷 ${{ steps.version.outputs.version_name }}

            由 tag `${{ github.ref_name }}`（`${{ github.sha }}`）触发的自动构建。

            ### 安装包（推荐真机 armv8）
            - `xianbao-v${{ steps.version.outputs.version_name }}-armv8-release.apk`
            - `xianbao-v${{ steps.version.outputs.version_name }}-armv7-release.apk`
            - `xianbao-v${{ steps.version.outputs.version_name }}-x86_64-release.apk`

            ### 版本
            - 版本号: `${{ steps.version.outputs.version_name }}`

            ### 客户端检测更新
            - `publish/version.json`（raw / jsDelivr 镜像）
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version back to main
        shell: bash
        run: |
          set -euo pipefail
          version_name="${{ steps.version.outputs.version_name }}"
          version_full="${{ steps.version.outputs.version_full }}"

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::warning::tag 提交不在 main 上，跳过 pubspec.yaml / publish/version.json 回写（Release 已发布）"
            exit 0
          fi

          sed -i -E "s/^version: .*/version: ${version_full}/" pubspec.yaml
          echo "pubspec version -> ${version_full}"

          short_sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          export VERSION_NAME="$version_name"
          export VERSION_DESC="$(printf '线报酷 %s\n由 tag %s 自动构建（%s）\n推荐下载 armv8 安装包。' "$version_name" '${{ github.ref_name }}' "$short_sha")"
          python3 scripts/ci_update_version_json.py

          git add pubspec.yaml publish/version.json
          if git diff --cached --quiet; then
            echo "No version change to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${version_name} [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push failed (attempt $i), rebasing..."
            git pull --rebase origin main
            sleep 2
          done
          exit 1

      - name: Wipe signing materials from runner
        if: always()
        shell: bash
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties || true
